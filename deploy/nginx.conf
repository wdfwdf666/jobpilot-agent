# nginx 站点配置：静态资源托管 + /api 反向代理到后端容器。
# 由 frontend/Dockerfile 拷到 /etc/nginx/conf.d/default.conf，覆盖官方默认配置。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 上传简历 PDF 走这条链路。nginx 默认只放 1m，不改会在入口直接 413，
    # 请求根本到不了后端——很容易被误判成后端上传逻辑的 bug。
    client_max_body_size 20m;

    # 常见简历 PDF 在几百 KB 量级，而默认 client_body_buffer_size 只有 8k/16k，
    # 结果是每个上传都先落一次磁盘临时文件（nginx 会在日志里 warn）。
    # 调到 1m 让常见文件全程走内存。注意这是单请求的内存上限，
    # 别调得比「并发数 × 预期文件大小」还激进。
    client_body_buffer_size 1m;

    gzip            on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml;

    # ---------- 健康检查透传 ----------
    # 后端 /health 不在 /api 前缀下，单独透出来：部署平台的探针与人工排障都要用它，
    # 返回体带 warmup 报告（能直接看出向量库起没起）。
    #
    # 路径约定（别搞混）：**根路径只给第三方/探针用的接口（目前仅 /health）**，
    # 其余后端路由（/chat、/kb、/interview …）一律经 /api 前缀访问。
    # 这条约定有个脚坑：直接 curl 根路径下的后端路由（如 /interview/report/x）
    # 不会 404，而是被下面的 SPA fallback 接住、返回 200 + index.html——
    # 看着像成功，实际拿到一坨 HTML。加后端路由时记得前端也走 /api。
    location = /health {
        proxy_pass http://api:8000/health;
        access_log off;
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        # 结尾这个 / 不能省：它把匹配到的 /api/ 前缀替换成 /，
        # 于是 /api/chat/stream 到后端就是 /chat/stream（后端路由无 /api 前缀）。
        # 写成 http://api:8000（无尾斜杠）会原样透传前缀，后端全部 404。
        # 语义与 vite.config.ts 里的 rewrite: path.replace(/^\/api/, '') 完全一致。
        proxy_pass http://api:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 置空 Connection，让 nginx 用长连接跟后端通信，SSE 不必逐个事件重连
        proxy_set_header Connection        "";

        # SSE 关键项：不关缓冲的话，流式回答会被 nginx 攒在缓冲区里，
        # 前端表现为"卡住几秒然后整段弹出"，逐字打字效果全没了。
        # 后端已带 X-Accel-Buffering: no 响应头，这里再关一次做双保险。
        proxy_buffering off;
        proxy_cache     off;
        gzip            off;
        # 默认读超时 60s：长回答 + 工具调用链有概率踩到，放宽到 5 分钟
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 带内容 hash 的构建产物：可长期强缓存 ----------
    # vite 产物文件名含内容 hash，内容一变文件名就变，不会读到旧版本。
    #
    # 只由 add_header 给 Cache-Control，不再加 expires 指令：expires 自身也会生成一个
    # Cache-Control: max-age=...，两者叠加会吐出两个同名响应头（浏览器虽能处理，但不规范）。
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ---------- SPA 兜底 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 必须回源校验：它记录了当前版本引用的 chunk 文件名，
    # 一旦被缓存住，用户会拿着旧 html 去请求已经删掉的旧 chunk → 白屏。
    # （精确匹配 = 优先级最高，所以放在最后写也不影响生效）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
