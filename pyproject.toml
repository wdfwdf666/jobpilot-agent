[project]
name = "jobpilot"
version = "0.1.0"
description = "JobPilot - 基于 LangGraph 的多 Agent 智能求职助手"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # LLM / Agent
    "openai>=1.40",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # RAG
    "chromadb>=0.5",
    "pypdf>=4.0",
    "python-docx>=1.1",
    # 工具
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # 前端
    "streamlit>=1.38",
]

[project.optional-dependencies]
# V2 混合检索需要（第 2 周再装）
hybrid = ["rank-bm25>=0.2", "jieba>=0.42", "sentence-transformers>=3.0"]
eval = ["pandas>=2.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 必须显式限定范围：否则 setuptools 的 flat-layout 自动发现会把 data/frontend/scripts
# 也当作顶层包，报 "Multiple top-level packages discovered in a flat-layout"，
# 导致 editable 安装直接失败（本项目真实踩坑）。
where = ["."]
include = ["app*"]
exclude = ["data*", "frontend*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uvicorn]
port = 8000
