[project]
name = "jobpilot"
version = "0.1.0"
description = "JobPilot - 基于 LangGraph 的多 Agent 智能求职助手"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # LLM / Agent
    "openai>=1.40",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # RAG
    "chromadb>=0.5",
    "pypdf>=4.0",
    "python-docx>=1.1",
    # 混合检索（V2 默认模式，见 app/rag/hybrid.py）
    "jieba>=0.42",
    "rank-bm25>=0.2",
    # 工具
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# 重排（可选增强，CPU 推理慢、依赖重，规模化后再启用）
rerank = ["sentence-transformers>=3.0"]
eval = ["pandas>=2.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 必须显式限定范围：否则 setuptools 的 flat-layout 自动发现会把 data/frontend/scripts
# 也当作顶层包，报 "Multiple top-level packages discovered in a flat-layout"，
# 导致 editable 安装直接失败（本项目真实踩坑）。
where = ["."]
include = ["app*"]
exclude = ["data*", "frontend*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uvicorn]
port = 8000
